services:
  # The Database Service
  ecg-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecg-vision-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD} # Pulls from .env
    ports:
      - "1433:1433" # Maps container port to your host machine port

  # Your .NET Web App Service
  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecg-vision-web
    ports:
      - "5000:8080" # Access your app at http://localhost:5000
    environment:
      # Format: Section__Property
      - ConnectionStrings__DefaultConnection=Server=ecg-db;Database=EcgVisionDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
      - PythonOptions__PythonExe=${PYTHON_EXE_PATH}
      - PythonOptions__ScriptFolder=${SCRIPTS_DIR}
      - Jwt__Key=${JWT_SECRET_KEY}
      - Storage__S3__AccessKey=${S3_ACCESS_KEY}
      - Storage__S3__SecretKey=${S3_SECRET_KEY}
      - Storage__S3__ServiceUrl=${S3_SERVICE_URL}
      - Storage__S3__BucketName=${S3_BUCKET_NAME}
      - Storage__S3__Region=${S3_REGION}
      - SeedData__AdminPassword=${ADMIN_PASSWORD}
      - SeedData__AdminEmail=${ADMIN_EMAIL}
    depends_on:
      - ecg-db # Ensures the DB container starts before the Web App